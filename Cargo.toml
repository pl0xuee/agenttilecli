[package]
name = "agenttilecli"
version = "1.0.0"
edition = "2024"

[dependencies]
# `v4_16` buys CSS custom properties and `:root` - which the accent colours
# already needed at runtime (see `main::standalone_colour_css`), previously
# behind a version check because the floor was 4.12. Every distro in the
# README's install table ships 4.16 or later now; the one release the raise
# actually drops is Ubuntu 24.10, which is past EOL.
gtk4 = { version = "0.11", features = ["v4_16"] }
# Pinned to the 1.7 API rather than the newest available. 1.7 is where
# AdwToggleGroup landed, which the header's mode switcher wants to be instead
# of a linked ToggleButton row - and it is also where Debian trixie, the
# oldest distro in the README's table, froze. 1.8's additions
# (AdwShortcutsDialog) stay declined for exactly that reason: the shortcuts
# sheet has a perfectly good 1.7 answer and trixie does not have a 1.8.
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
# `v0_70` is for `check_match_at`, which is the only way this binding offers to
# ask "is there a link under this pointer" - and without it, clickable URLs
# would be limited to OSC 8 hyperlinks, which is a small fraction of the links
# an agent actually prints. It raises the runtime floor from VTE 0.65 to 0.70
# (September 2022), which costs nothing real: the GTK4 flavour of VTE this app
# needs is itself recent enough that every distro in the README's install table
# ships 0.76 or newer.
vte4 = { version = "0.10", features = ["v0_70"] }
# The editor the sidebar's folder tree opens files into. This is the one job
# where hand-rolling loses on every axis at once: syntax highlighting for a
# couple of hundred languages, line numbers, and undo integration are exactly
# what GtkSourceView is, and a home-made lexer would be a permanent maintenance
# surface bought to avoid a ~1 MB library whose every dependency the GTK4 stack
# already pulls in. It does raise the install floor by one package
# (`gtksourceview5` / `gtksourceview5-devel` / `libgtksourceview-5-dev`), which
# the README's table and install.sh's check both state.
sourceview5 = "0.11"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
